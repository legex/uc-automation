<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Webex CUCM Integration{% endblock %}</title>
    <style>
        :root {
            --bg-gradient-start: #0f2027;
            --bg-gradient-mid1: #203a43;
            --bg-gradient-mid2: #2c5364;
            --bg-gradient-mid3: #1a1a2e;
            --bg-gradient-end: #000000;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-tertiary: #aaaaaa;
            --accent-primary: #00d4ff;
            --accent-secondary: #0099cc;
            --navbar-bg: rgba(0, 100, 200, 0.15);
            --section-bg: rgba(30, 60, 114, 0.3);
            --border-color: rgba(100, 200, 255, 0.2);
            --border-color-strong: rgba(100, 200, 255, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --hover-bg: rgba(0, 212, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(100, 200, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid1) 25%, var(--bg-gradient-mid2) 50%, var(--bg-gradient-mid3) 75%, var(--bg-gradient-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color-strong);
            box-shadow: 0 8px 32px var(--shadow-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: var(--accent-primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: var(--hover-bg);
            border-color: var(--border-color-strong);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        h2 {
            color: var(--accent-primary);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .section {
            background: var(--section-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0099cc, #00d4ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 153, 204, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2c5364, #203a43);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #203a43, #2c5364);
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-primary);
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--hover-bg);
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid;
        }

        .alert-success {
            background: rgba(0, 200, 100, 0.2);
            border-color: rgba(0, 200, 100, 0.5);
            color: #00ff88;
        }

        .alert-error {
            background: rgba(255, 50, 50, 0.2);
            border-color: rgba(255, 50, 50, 0.5);
            color: #ff6666;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: rgba(30, 60, 114, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-title {
            font-size: 1.5rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .card-description {
            color: #cccccc;
            line-height: 1.6;
        }

        .loader {
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: var(--text-tertiary);
            border-top: 1px solid var(--border-color);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">🚀 Webex CUCM Integration</a>
        <ul class="navbar-nav">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/api/ldap-services" class="nav-link">LDAP</a></li>
            <li><a href="/api/webex-services" class="nav-link">Webex</a></li>
            <li><a href="/api/routepattern-services" class="nav-link">Route Patterns</a></li>
            <li><a href="/api/number-services" class="nav-link">Numbers</a></li>
        </ul>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>&copy; 2025 Webex CUCM Integration Dashboard. All rights reserved.</p>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
