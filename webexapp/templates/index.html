<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webex CUCM Integration Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #000428 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            background: linear-gradient(45deg, #00d4ff, #0099cc); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
        }
        .section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .section h2 { 
            color: #00d4ff; 
            margin-bottom: 20px; 
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 500; color: #e0e0e0; }
        input, select { 
            padding: 12px; 
            border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 10px; 
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #00d4ff; 
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }
        input::placeholder { color: rgba(255,255,255,0.7); }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(45deg, #00d4ff, #0099cc); 
            color: white; 
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,212,255,0.4); }
        .btn-secondary { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border: 2px solid rgba(255,255,255,0.3);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .result { 
            margin-top: 15px; 
            padding: 15px; 
            border-radius: 10px; 
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            border-left: 4px solid #00d4ff;
        }
        .success { border-left-color: #4ade80; background: rgba(74,222,128,0.2); }
        .error { border-left-color: #f87171; background: rgba(248,113,113,0.2); }
        #fileResults { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .download-link { 
            display: inline-block; 
            margin-top: 10px; 
            padding: 8px 16px; 
            background: rgba(0,212,255,0.2); 
            text-decoration: none; 
            border-radius: 6px;
            color: white;
        }
        .download-link:hover { background: rgba(0,212,255,0.3); }
        .loading { opacity: 0.7; pointer-events: none; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { 
            padding: 10px 20px; 
            background: rgba(255,255,255,0.1); 
            border: none; 
            border-radius: 25px; 
            color: white; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab.active { background: linear-gradient(45deg, #00d4ff, #0099cc); transform: translateY(-2px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Webex CUCM Integration Dashboard</h1>
        
        <div class="section">
            <div class="tab-container">
                <button class="tab active" onclick="showTab('single')">Single User</button>
                <button class="tab" onclick="showTab('batch')">Batch Upload</button>
                <button class="tab" onclick="showTab('templates')">Templates</button>
                <button class="tab" onclick="showTab('route')">Route Patterns</button>
            </div>

            <!-- Single User Forms -->
            <div id="single" class="tab-content active">
                <div class="form-grid">
                    <div>
                        <h2>👤 LDAP Update</h2>
                        <form id="ldapForm">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" name="username" placeholder="username" required>
                            </div>
                            <div class="form-group">
                                <label>Extension</label>
                                <input type="text" name="extension" placeholder="1001" required>
                            </div>
                            <div class="form-group">
                                <label>External Number (Optional)</label>
                                <input type="text" name="externalnumber" placeholder="+1234567890">
                            </div>
                            <button type="submit" class="btn btn-primary">Update LDAP</button>
                        </form>
                        <div id="ldapResult"></div>
                    </div>

                    <div>
                        <h2>☁️ Webex General</h2>
                        <form id="webexGeneralForm">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" name="username" placeholder="user@domain.com" required>
                            </div>
                            <div class="form-group">
                                <label>Extension</label>
                                <input type="text" name="extension" placeholder="1001" required>
                            </div>
                            <div class="form-group">
                                <label>Region</label>
                                <select name="region" required>
                                    <option value="">Select Region</option>
                                    <option value="US">US</option>
                                    <option value="EU">EU</option>
                                    <option value="AP">AP</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>External Number (Optional)</label>
                                <input type="text" name="externalnumber" placeholder="+1234567890">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Webex General</button>
                        </form>
                        <div id="webexGeneralResult"></div>
                    </div>

                    <div>
                        <h2>📞 Webex ACD</h2>
                        <form id="webexAcdForm">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" name="username" placeholder="user@domain.com" required>
                            </div>
                            <div class="form-group">
                                <label>Extension</label>
                                <input type="text" name="extension" placeholder="1001" required>
                            </div>
                            <div class="form-group">
                                <label>Region</label>
                                <select name="region" required>
                                    <option value="">Select Region</option>
                                    <option value="US">US</option>
                                    <option value="EU">EU</option>
                                    <option value="AP">AP</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>External Number *</label>
                                <input type="text" name="externalnumber" placeholder="+1234567890" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Webex ACD</button>
                        </form>
                        <div id="webexAcdResult"></div>
                    </div>
                </div>
            </div>

            <!-- Batch Upload Forms -->
            <div id="batch" class="tab-content">
                <div class="form-grid">
                    <div>
                        <h2>📊 Batch LDAP</h2>
                        <form id="batchLdapForm" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>CSV File</label>
                                <input type="file" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Batch LDAP Update</button>
                        </form>
                        <div id="batchLdapResult"></div>
                    </div>

                    <div>
                        <h2>☁️ Batch Webex General</h2>
                        <form id="batchWebexGenForm" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>CSV File</label>
                                <input type="file" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Batch Webex General</button>
                        </form>
                        <div id="batchWebexGenResult"></div>
                    </div>

                    <div>
                        <h2>📞 Batch Webex ACD</h2>
                        <form id="batchWebexAcdForm" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>CSV File</label>
                                <input type="file" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Batch Webex ACD</button>
                        </form>
                        <div id="batchWebexAcdResult"></div>
                    </div>

                    <div>
                        <h2>➕ Number Add</h2>
                        <form id="numberAddForm" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>CSV File</label>
                                <input type="file" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Numbers</button>
                        </form>
                        <div id="numberAddResult"></div>
                    </div>
                </div>
                <div id="fileResults"></div>
            </div>

            <!-- Templates -->
            <div id="templates" class="tab-content">
                <h2>📋 Download Templates</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;">
                    <a href="/download/template/ldap_update" class="btn btn-secondary" target="_blank">LDAP Template</a>
                    <a href="/download/template/webex_general_update" class="btn btn-secondary" target="_blank">Webex General</a>
                    <a href="/download/template/webex_acd_update" class="btn btn-secondary" target="_blank">Webex ACD</a>
                    <a href="/download/template/number_add" class="btn btn-secondary" target="_blank">Number Add</a>
                    <a href="/download/template/cucm_route_pattern" class="btn btn-secondary" target="_blank">CUCM Route Pattern</a>
                </div>
            </div>

            <!-- Route Patterns -->
            <div id="route" class="tab-content">
                <h2>🛤️ CUCM Route Patterns</h2>
                <form id="routePatternForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>CSV File</label>
                        <input type="file" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Route Patterns</button>
                </form>
                <div id="routePatternResult"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab functionality
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Universal form handler
        async function handleFormSubmit(form, endpoint, resultId, isMultipart = false) {
            const submitter = form.querySelector('button[type="submit"]');
            const originalText = submitter.textContent;
            const resultsDiv = document.getElementById(resultId);
            
            try {
                submitter.textContent = 'Processing...';
                submitter.parentElement.classList.add('loading');
                resultsDiv.innerHTML = '';

                const formData = new FormData(form);  // ← ALWAYS use FormData

                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData  // ← ALWAYS send FormData (no JSON.stringify!)
                });

                const data = await response.json();
                
                if (data.Status || data.status === 'success') {
                    resultsDiv.innerHTML = `<div class="result success">${JSON.stringify(data, null, 2)}</div>`;
                    
                    // Handle download links for number add
                    if (endpoint.includes('numberadd')) {
                        const filename = form.file.files[0]?.name;
                        if (filename && data.Status === 'Success') {
                            resultsDiv.innerHTML += `<a href="/download/${filename}" class="download-link" target="_blank">📥 Download Results</a>`;
                        }
                    }
                } else {
                    resultsDiv.innerHTML = `<div class="result error">Error: ${JSON.stringify(data, null, 2)}</div>`;
                }
            } catch (error) {
                document.getElementById(resultId).innerHTML = `<div class="result error">Network Error: ${error.message}</div>`;
            } finally {
                submitter.textContent = originalText;
                submitter.parentElement.classList.remove('loading');
            }
        }


        // Event listeners
        document.getElementById('ldapForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updateldap/single', 'ldapResult');
        });

        document.getElementById('webexGeneralForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updatewebexgeneral', 'webexGeneralResult');
        });

        document.getElementById('webexAcdForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updatewebexacd', 'webexAcdResult');
        });

        document.getElementById('batchLdapForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updateldap/batch', 'batchLdapResult', true);
        });

        document.getElementById('batchWebexGenForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updatewebexgeneral', 'batchWebexGenResult', true);
        });

        document.getElementById('batchWebexAcdForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/updatewebexacd', 'batchWebexAcdResult', true);
        });

        document.getElementById('numberAddForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/numberadd', 'numberAddResult', true);
        });

        document.getElementById('routePatternForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleFormSubmit(e.target, '/routepattern', 'routePatternResult', true);
        });
    </script>
</body>
</html>
